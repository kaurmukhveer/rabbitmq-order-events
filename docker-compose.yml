version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-order-events
    ports:
      - "5672:5672"   # AMQP protocol port (used by producer.js / consumer.js)
      - "15672:15672" # Management UI (http://localhost:15672 — login: guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  consumer:
    build: .
    container_name: order-consumer
    command: ["node", "consumer.js"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      JWT_SECRET: dev-only-secret-change-me
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "3000:3000" # Orders API
    volumes:
      - orders-data:/app/data # SQLite file survives `docker-compose restart consumer`

  producer:
    build: .
    container_name: order-producer
    command: ["node", "producer.js"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672

volumes:
  orders-data:
