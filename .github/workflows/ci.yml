name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
     matrix:
        # windows-latest is intentionally excluded: better-sqlite3's native
        # addon doesn't reliably build from source on GitHub's Windows
        # runners, and this project only ever deploys to Linux (see
        # Dockerfile / docker-compose.yml), so Windows coverage isn't
        # testing a real deployment target.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Jest (schema, message-handler, API/RBAC)
        run: npx jest --runInBand

      - name: Run pytest (schema.py)
        run: pytest tests/test_schema.py -v

  integration-test:
    name: RabbitMQ integration test (Linux only)
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm ci

      - name: Install jq (for smoke_test.sh)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Start the consumer (with the Orders API) in the background
        run: nohup node consumer.js > consumer.log 2>&1 &
        env:
          DB_PATH: ${{ github.workspace }}/orders-ci.db

      - name: Wait for the consumer to connect and the API to come up
        run: sleep 5

      - name: Start the producer briefly to generate order events
        run: timeout 12s node producer.js || true

      - name: Give the consumer time to process the backlog
        run: sleep 5

      - name: Run the bash smoke test against the Orders API
        run: ./smoke_test.sh

      - name: Show consumer log on failure
        if: failure()
        run: cat consumer.log || true
